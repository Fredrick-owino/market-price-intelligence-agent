[project]
name = "sokosignal"
version = "0.0.0"
description = "Dependency boundary for the SokoSignal preparation workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint>=4.1,<5",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "mcp>=2.0,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ollama = [
  "ollama>=0.6,<0.7",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.15,<1",
]

[tool.uv]
# There is no application package yet; lock dependencies without building one.
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
